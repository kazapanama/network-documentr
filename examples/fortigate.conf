#config-version=FGT60E-7.2.5-FW-build1517-230606:opmode=0:vdom=0:user=admin
#conf_file_ver=12345
#buildno=1517
config system global
    set admintimeout 30
    set hostname "FGT-OFFICE"
    set timezone 26
end
config system interface
    edit "wan1"
        set vdom "root"
        set ip 203.0.113.2 255.255.255.252
        set allowaccess ping
        set type physical
        set alias "ISP-1"
        set role wan
    next
    edit "internal"
        set vdom "root"
        set ip 192.168.1.1 255.255.255.0
        set allowaccess ping https ssh
        set type hard-switch
        set role lan
    next
    edit "mgmt"
        set vdom "root"
        set ip 10.255.1.1 255.255.255.0
        set allowaccess ping https ssh
        set type physical
        set dedicated-to management
    next
    edit "vlan100"
        set vdom "root"
        set ip 10.0.100.1 255.255.255.0
        set allowaccess ping
        set description "Users floor 1"
        set role lan
        set interface "internal"
        set vlanid 100
    next
    edit "agg1"
        set vdom "root"
        set type aggregate
        set member "port1" "port2"
    next
    edit "port1"
        set vdom "root"
        set type physical
    next
    edit "port2"
        set vdom "root"
        set type physical
        set status down
    next
    edit "VPN-tun"
        set vdom "root"
        set type tunnel
        set interface "wan1"
    next
end

FGT-OFFICE # get system status
